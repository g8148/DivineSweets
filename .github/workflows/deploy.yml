name: Deploy para VPS (main)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 20m
          script: |
            cd /opt/DivineSweets
            git fetch origin main
            git reset --hard origin/main
            bash /opt/DivineSweets/infra/deploy.sh

      - name: Verificar saúde do serviço
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            systemctl is-active divinesweets-api || (echo "ERRO: serviço parado" && exit 1)
            curl -sf http://localhost:8100/health -o /dev/null && echo "API OK"
            curl -sf http://localhost:8100/openapi.json -o /dev/null && echo "Docs OK"
