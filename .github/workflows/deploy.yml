name: Deploy para VPS (main)

on:
  push:
    branches:
      - main
  # Permite disparar o deploy à mão, sem precisar de um commit novo.
  workflow_dispatch:

jobs:
  # O contexto `secrets` não é legível na condição de um job, só dentro de um
  # passo. Por isso a verificação vira um job próprio, que publica o resultado
  # como saída para o deploy consultar.
  verificar:
    name: Conferir se a VPS está configurada
    runs-on: ubuntu-latest
    outputs:
      configurado: ${{ steps.checar.outputs.configurado }}
    steps:
      - name: Procurar os segredos da VPS
        id: checar
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo 'configurado=sim' >> "$GITHUB_OUTPUT"
            echo "::notice::Segredos encontrados — o deploy vai rodar."
          else
            echo 'configurado=nao' >> "$GITHUB_OUTPUT"
            echo "::notice::Sem os segredos VPS_HOST, VPS_USER e VPS_SSH_KEY o deploy é ignorado. Configure-os em Settings → Secrets and variables → Actions para ligar a publicação automática."
          fi

  deploy:
    name: Deploy na VPS
    needs: verificar
    if: needs.verificar.outputs.configurado == 'sim'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 20m
          script: |
            cd /opt/DivineSweets
            git fetch origin main
            git reset --hard origin/main
            bash /opt/DivineSweets/infra/deploy.sh

      - name: Verificar saúde do serviço
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            systemctl is-active divinesweets-api || (echo "ERRO: serviço parado" && exit 1)
            curl -sf http://localhost:8100/health -o /dev/null && echo "API OK"
            curl -sf http://localhost:8100/openapi.json -o /dev/null && echo "Docs OK"
